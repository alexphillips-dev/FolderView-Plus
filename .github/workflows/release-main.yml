name: Release Main

on:
  workflow_dispatch:

concurrency:
  group: folderview-plus-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Remove today's packages to avoid collision detection in pkg_build.sh
      - name: Clean existing packages for today
        run: |
          TODAY=$(date +"%Y.%m.%d")
          rm -f archive/folderview.plus-${TODAY}*.txz
          echo "Cleaned packages for $TODAY"

      - name: Build stable package
        run: |
          chmod +x pkg_build.sh
          bash pkg_build.sh

      - name: Ensure CHANGES entry for release version
        run: |
          chmod +x scripts/ensure_plg_changes_entry.sh
          bash scripts/ensure_plg_changes_entry.sh

      - name: Run release validation suite
        env:
          FVPLUS_UNRAID_MATRIX: ${{ secrets.FVPLUS_UNRAID_MATRIX }}
          FVPLUS_UNRAID_MATRIX_REQUIRED: ${{ secrets.FVPLUS_UNRAID_MATRIX != '' && '1' || '0' }}
          FVPLUS_UNRAID_REQUIRED_VERSIONS: '7.0.x,7.1.x,7.2.x'
          FVPLUS_UNRAID_REQUIRED_THEMES: 'black,white'
          FVPLUS_I18N_STRICT: '1'
          FVPLUS_DEAD_CODE_STRICT: '1'
          FVPLUS_REQUIRE_PERF_BASELINE: '1'
          FVPLUS_MAIN_HISTORY_BASE_REF: ${{ github.event.before }}
          FVPLUS_BROWSER_SMOKE_URL: ${{ secrets.FVPLUS_BROWSER_SMOKE_URL }}
          FVPLUS_BROWSER_SMOKE_REQUIRED: '1'
          FVPLUS_BROWSER_SMOKE_TIMEOUT_MS: '90000'
          FVPLUS_BROWSER_SMOKE_IGNORE_HTTPS: '1'
          FVPLUS_BROWSER_SMOKE_REQUIRE_FOLDER_EDITOR: '1'
          FVPLUS_BROWSER_SMOKE_REQUIRE_RUNTIME_ROWS: '1'
          FVPLUS_BROWSER_SMOKE_RUNTIME_GAP_MAX: '30'
          FVPLUS_BROWSER_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/tmp/browser-smoke-artifacts
          FVPLUS_THEME_MATRIX_URLS: ${{ secrets.FVPLUS_THEME_MATRIX_URLS }}
          FVPLUS_THEME_MATRIX_REQUIRED: '1'
          FVPLUS_THEME_REQUIRED_LABELS: 'black,white'
          FVPLUS_THEME_SMOKE_TIMEOUT_MS: '90000'
          FVPLUS_THEME_SMOKE_IGNORE_HTTPS: '1'
          FVPLUS_THEME_SMOKE_BROWSERS: 'chromium,firefox,webkit'
          FVPLUS_THEME_SMOKE_ZOOMS: '1,1.25,1.5'
          FVPLUS_THEME_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/tmp/browser-smoke-artifacts/theme-matrix
          FVPLUS_PLAYWRIGHT_INSTALL_WITH_DEPS: '1'
        run: |
          chmod +x scripts/run_ci_suite.sh
          bash scripts/run_ci_suite.sh --release

      - name: Extract stable version
        id: version
        run: |
          VERSION=$(grep -oP '<!ENTITY version "\K[^"]+' folderview.plus.plg)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          FILENAME="folderview.plus-${VERSION}.txz"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "Stable version: $VERSION"

      - name: Commit stable release to main
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No release file changes to commit."
          else
            git commit -m "Stable release ${{ steps.version.outputs.version }}"
          fi

      - name: Push main
        run: git push origin main

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-main-debug-${{ github.run_id }}-${{ github.job }}
          if-no-files-found: ignore
          path: |
            folderview.plus.plg
            folderview.plus.xml
            archive/*.txz
            archive/*.sha256
            tmp/browser-smoke-artifacts/**
            *.log
            scripts/*.log
