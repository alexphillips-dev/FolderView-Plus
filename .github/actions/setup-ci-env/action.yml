name: Setup CI Environment
description: Prepare Node, shellcheck, npm cache, and Playwright cache for FolderView Plus workflows.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '20'
  cache-key-suffix:
    description: Extra cache key suffix to allow targeted cache busting
    required: false
    default: 'v1'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore npm cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-fvplus-npm-${{ inputs.cache-key-suffix }}-${{ hashFiles('.github/actions/setup-ci-env/action.yml', 'scripts/run_ci_suite.sh', 'package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-fvplus-npm-${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-fvplus-npm-

    - name: Restore Playwright browser cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-fvplus-playwright-${{ inputs.cache-key-suffix }}-${{ hashFiles('.github/actions/setup-ci-env/action.yml', 'scripts/run_ci_suite.sh', 'package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-fvplus-playwright-${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-fvplus-playwright-

    - name: Install shellcheck
      shell: bash
      run: |
        set -euo pipefail
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck --version
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install -y shellcheck
