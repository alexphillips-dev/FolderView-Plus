name: Release On Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folderview-plus-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          filter: blob:none

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env

      - name: Detect release artifact changes
        id: release_scope
        shell: bash
        run: |
          set -euo pipefail
          MANUAL_DISPATCH='${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}'
          BEFORE_SHA='${{ github.event.before }}'
          AFTER_SHA='${{ github.sha }}'
          RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            RANGE="${AFTER_SHA}^..${AFTER_SHA}"
          fi
          if [[ "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ ]] && ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --filter=blob:none --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          changed_paths=$(git diff --name-only "$RANGE")
          if grep -Eq '^(docs/sbom\.cdx\.json|package-lock\.json|scripts/runtime_components\.json|\.github/workflows/dependency-vulnerability-scan\.yml|scripts/osv_scan_evidence\.mjs|scripts/lib/(osv-evidence|github-release-validation|release-evidence)\.mjs)$' <<< "$changed_paths"; then
            echo 'FVPLUS_REQUIRE_MAIN_OSV=1' >> "$GITHUB_ENV"
          fi
          mapfile -t changed_files <<< "$changed_paths"
          should_publish=0
          for changed_file in "${changed_files[@]}"; do
            case "${changed_file}" in
              folderview.plus.plg|archive/*.txz|archive/*.sha256)
                should_publish=1
                break
                ;;
            esac
          done
          if [[ "${MANUAL_DISPATCH}" == '1' ]]; then
            should_publish=1
          fi

          {
            echo "range=${RANGE}"
            echo "manual_dispatch=${MANUAL_DISPATCH}"
            echo "should_publish=${should_publish}"
          } >> "${GITHUB_OUTPUT}"

      - name: Skip release publish for non-release main pushes
        if: steps.release_scope.outputs.should_publish != '1'
        shell: bash
        run: |
          {
            echo "## Release publish skipped"
            echo
            echo "No release artifacts changed on this \`main\` push, so GitHub release publishing was intentionally skipped."
            echo "Workflow/process-only syncs can land on \`main\` without creating a new plugin release."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Resolve release version and archive
        id: release_meta
        if: steps.release_scope.outputs.should_publish == '1'
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '<!ENTITY version "\K[^"]+' folderview.plus.plg)
          ARCHIVE="archive/folderview.plus-${VERSION}.txz"
          CHECKSUM="${ARCHIVE}.sha256"
          if [ ! -f "${ARCHIVE}" ]; then
            echo "ERROR: expected archive not found: ${ARCHIVE}" >&2
            exit 1
          fi
          test -f "$CHECKSUM" || { echo 'ERROR: committed checksum is missing.' >&2; exit 1; }
          {
            echo "version=${VERSION}"
            echo "archive=${ARCHIVE}"
            echo "checksum=${CHECKSUM}"
            echo "tag=v${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Require exact candidate CI and security results
        if: steps.release_scope.outputs.should_publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release_validation.mjs wait
          bash scripts/release_guard.sh
          FVPLUS_REQUIRE_EXPLICIT_RELEASE_NOTES=1 bash scripts/release_notes_consistency_guard.sh

      - name: Fetch previous stable release reference
        if: steps.release_scope.outputs.should_publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName | node --input-type=module -e 'import fs from "node:fs"; const current=process.env.CURRENT_TAG; const tags=JSON.parse(fs.readFileSync(0,"utf8")).map(r=>r.tagName).filter(t=>/^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$/.test(t)&&t<current).sort().reverse(); console.log(tags[0]||"");')
          if [[ -n "$previous" ]]; then
            [[ "$previous" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]
            git fetch --filter=blob:none --no-tags --depth=1 origin "refs/tags/$previous:refs/tags/$previous"
            echo "FVPLUS_RELEASE_PREVIOUS_REF=$previous" >> "$GITHUB_ENV"
          fi

      - name: Build release notes from current CHANGES block
        id: notes
        if: steps.release_scope.outputs.should_publish == '1'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release_meta.outputs.version }}"
          chmod +x scripts/build_release_notes.sh
          bash scripts/build_release_notes.sh --version "${VERSION}" --output release_notes.md

      - name: Validate remote raw publish artifacts
        if: steps.release_scope.outputs.should_publish == '1'
        env:
          FVPLUS_REMOTE_PUBLISH_ATTEMPTS: '30'
          FVPLUS_REMOTE_PUBLISH_DELAY_SEC: '10'
        run: |
          chmod +x scripts/remote_publish_guard.sh
          bash scripts/remote_publish_guard.sh

      - name: Attest release archive provenance
        if: steps.release_scope.outputs.should_publish == '1'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.2.0
        with:
          subject-path: |
            ${{ steps.release_meta.outputs.archive }}
            ${{ steps.release_meta.outputs.checksum }}

      - name: Attest release archive SBOM
        if: steps.release_scope.outputs.should_publish == '1'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.2.0
        with:
          subject-path: ${{ steps.release_meta.outputs.archive }}
          sbom-path: docs/sbom.cdx.json

      - name: Ensure GitHub CLI
        if: steps.release_scope.outputs.should_publish == '1'
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create or update GitHub release
        if: steps.release_scope.outputs.should_publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          FVPLUS_GITHUB_RELEASE_ATTEMPTS: '6'
          FVPLUS_GITHUB_RELEASE_DELAY_SEC: '10'
        run: |
          set -euo pipefail
          TAG="${{ steps.release_meta.outputs.tag }}"
          ARCHIVE="${{ steps.release_meta.outputs.archive }}"
          CHECKSUM="${{ steps.release_meta.outputs.checksum }}"

          retry_command() {
            local label="$1"
            shift
            local attempts="${FVPLUS_GITHUB_RELEASE_ATTEMPTS:-6}"
            local delay="${FVPLUS_GITHUB_RELEASE_DELAY_SEC:-10}"
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                echo "::error::${label} failed after ${attempts} attempts."
                return 1
              fi
              echo "::warning::${label} failed on attempt ${attempt}/${attempts}; retrying in ${delay}s."
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay < 60 ? delay * 2 : 60))
            done
          }

          release_exists=0
          inspect_attempt=1
          while (( inspect_attempt <= FVPLUS_GITHUB_RELEASE_ATTEMPTS )); do
            set +e
            inspect_output="$(gh release view "${TAG}" 2>&1)"
            inspect_status=$?
            set -e
            if (( inspect_status == 0 )); then
              release_exists=1
              break
            fi
            if grep -Eiq 'release not found|HTTP 404|Not Found' <<<"${inspect_output}"; then
              break
            fi
            if (( inspect_attempt >= FVPLUS_GITHUB_RELEASE_ATTEMPTS )); then
              echo "${inspect_output}" >&2
              echo "::error::Unable to determine whether release ${TAG} exists after ${inspect_attempt} attempts."
              exit 1
            fi
            echo "::warning::Release lookup failed on attempt ${inspect_attempt}/${FVPLUS_GITHUB_RELEASE_ATTEMPTS}; retrying."
            sleep "${FVPLUS_GITHUB_RELEASE_DELAY_SEC}"
            inspect_attempt=$((inspect_attempt + 1))
          done

          create_or_confirm_release() {
            if gh release create "${TAG}" --target "$GITHUB_SHA" --title "${TAG}" --notes-file release_notes.md; then
              return 0
            fi
            gh release view "${TAG}" >/dev/null 2>&1
          }

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          fi
          if (( release_exists == 1 )); then
            retry_command "Update release metadata" gh release edit "${TAG}" --title "${TAG}" --notes-file release_notes.md
            echo "Updated release ${TAG} metadata."
          else
            retry_command "Create release" create_or_confirm_release
            echo "Created release ${TAG}."
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          retry_command "Upload release package" gh release upload "${TAG}" "${ARCHIVE}" --clobber
          retry_command "Upload release checksum" gh release upload "${TAG}" "${CHECKSUM}" --clobber
          echo "Published release ${TAG} package and checksum assets."

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-on-main-debug-${{ github.run_id }}-${{ github.job }}
          if-no-files-found: ignore
          path: |
            folderview.plus.plg
            folderview.plus.xml
            archive/*.txz
            archive/*.sha256
            release_notes.md
            tmp/fixture-browser-artifacts/**
          retention-days: 7
