name: Back-Merge Main To Dev
on:
  workflow_run:
    workflows: [Release On Main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: folderview-plus-backmerge-main-to-dev
  cancel-in-progress: false
jobs:
  backmerge:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FVPLUS_EXPECT_PLUGIN_BRANCH: 'dev'
    steps:
      - name: Checkout published main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Configure local merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify published main and generate synchronization plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release_validation.mjs wait
          expected_main=$(git rev-parse HEAD)
          git fetch --filter=blob:none --no-tags origin main dev
          test "$expected_main" = "$(git rev-parse origin/main)"
          bash scripts/sync_main_to_dev.sh
          node scripts/sync_plan.mjs
      - name: Explain owner synchronization action
        run: |
          {
            echo '## Main-to-dev synchronization'
            echo
            echo 'The plan is read-only. No PR, remote branch, or duplicate validation was created.'
            echo 'After the authorized release is verified, run bash scripts/release_sync.sh --push-dev from current main.'
            echo 'Identical dev files reuse their existing validation; changed files qualify once before pushing.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain synchronization plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synchronization-plan-${{ github.run_id }}
          path: tmp/synchronization-plan.json
          if-no-files-found: error
          retention-days: 7
