name: Scheduled Cross-Browser Validation

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folderview-plus-scheduled-validation
  cancel-in-progress: true

jobs:
  cross-browser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env

      - name: Run Chromium, Firefox, and WebKit fixtures
        env:
          FVPLUS_FIXTURE_BROWSERS: chromium,firefox,webkit
        shell: bash
        run: bash scripts/run_ci_suite.sh --lane fixture-browser

      - name: Upload fixture artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scheduled-cross-browser-${{ github.run_id }}
          path: tmp/fixture-browser-artifacts
          if-no-files-found: ignore
          retention-days: 14
