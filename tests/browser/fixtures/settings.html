<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FolderView Plus Settings fixture</title>
    <link rel="stylesheet" href="/plugin/styles/theme.tokens.css">
    <link rel="stylesheet" href="/plugin/styles/ui.primitives.css">
    <link rel="stylesheet" href="/plugin/styles/folderviewplus.css">
    <link rel="stylesheet" href="/plugin/styles/folderviewplus.diagnostics.css">
    <link rel="stylesheet" href="/plugin/styles/folderviewplus.bootstrap.css">
    <link rel="stylesheet" href="/plugin/styles/start-order-workspace.css">
    <style>
        body { margin: 0; background: #171717; color: #eee; font-family: Arial, sans-serif; }
        body[data-fv-theme-class="light"],
        body[data-fvplus-host-theme="white"],
        body[data-fv-host-theme="white"] { background: #f5f6f8; color: #2b3441; }
        #fv-settings-root { padding: 1rem; }
        #fv-settings-root[data-fv-theme-class="light"] { min-height: 100vh; background: #f5f6f8; color: #2b3441; }
        button { min-height: 34px; padding: .3rem .55rem; box-sizing: border-box; font: inherit; }
        input, select { font: inherit; }
    </style>
</head>
<body>
    <main id="fv-settings-root" class="fv-theme-safe">
        <div id="fv-settings-topbar"></div>
        <section data-fixture-setting="docker"><h2>Docker folders</h2><label>Hide empty folders <input type="checkbox"></label></section>
        <section data-fixture-setting="privacy"><h2>Privacy mode</h2><label>Mask LAN IPs <input type="checkbox"></label></section>
        <section id="view-settings-fixture" aria-label="Filters and view settings fixture"></section>
        <section id="start-order-fixture" aria-label="Docker start order fixture">
            <div class="fv-docker-start-order-heading-row">
                <div class="fv-docker-start-order-heading-copy"><h2>Docker start order</h2><p>Define the order Unraid uses when Docker containers start at boot.</p></div>
                <div id="docker-start-order-summary" class="fv-docker-start-order-summary"></div>
            </div>
            <div class="fv-docker-start-order-panel"><div id="docker-start-order-workspace" class="fv-docker-start-order-workspace"></div></div>
        </section>
        <section id="diagnostics-fixture" aria-label="Diagnostics fixture">
            <div id="fv-diagnostics-workspace" class="fv-diagnostics-workspace">
                <header class="fv-diagnostics-workspace-head">
                    <p>Monitor plugin health.</p>
                    <div class="fv-diagnostics-toolbar">
                        <button type="button" class="fv-ui-button is-primary">Run health check</button>
                        <button type="button" class="fv-ui-button">Retest performance</button>
                        <button type="button" class="fv-ui-button is-export"><i class="fa fa-upload" aria-hidden="true"></i>Export support bundle</button>
                    </div>
                </header>
                <div id="fv-diagnostics-summary" class="fv-diagnostics-summary-surface" aria-live="polite"></div>
                <div id="fv-support-visual-fixture"></div>
            </div>
        </section>
    </main>
    <script src="/plugin/scripts/folderviewplus.csp-events.js"></script>
    <script src="/plugin/scripts/folderviewplus.ui.js"></script>
    <script src="/plugin/scripts/folderviewplus.mobile-reorder.js"></script>
    <script src="/plugin/scripts/folderviewplus.chrome.js"></script>
    <script src="/plugin/scripts/folderviewplus.support-bundle-preview.js"></script>
    <script src="/plugin/scripts/folderviewplus.diagnostics-view-model.js"></script>
    <script src="/plugin/scripts/folderviewplus.diagnostics-actions.js"></script>
    <script src="/plugin/scripts/folderviewplus.diagnostics-view.js"></script>
    <script src="/plugin/scripts/folderviewplus.start-order-view.js"></script>
    <script>
        document.getElementById('fv-settings-topbar').innerHTML = window.FolderViewPlusSettingsChrome.getTopbarHtml();
        const startOrderView = window.FolderViewPlusFoundationModules.startOrderView.createApi();
        const startOrderInfo = {
            audiobookshelf: { Labels: { 'net.unraid.docker.icon': '/plugin/images/third-party-icons/Icons/Yellow/yellow-audio.svg' }, info: { State: { Autostart: true } } },
            qbittorrentvpn: { Labels: { 'net.unraid.docker.icon': '/plugin/images/third-party-icons/Icons/Yellow/yellow-broadcast.svg' }, info: { State: { Autostart: true } } },
            sonarr: { Labels: { 'net.unraid.docker.icon': '/plugin/images/third-party-icons/Icons/Yellow/yellow-arrs.svg' }, info: { State: { Autostart: true } } },
            radarr: { Labels: { 'net.unraid.docker.icon': '/plugin/images/third-party-icons/Icons/Yellow/yellow-camera.svg' }, info: { State: { Autostart: true } } },
            prowlarr: { Labels: { 'net.unraid.docker.icon': '/plugin/images/third-party-icons/Icons/Yellow/yellow-control.svg' }, info: { State: { Autostart: true } } },
            adminer: { Labels: { 'net.unraid.docker.icon': '/plugin/images/third-party-icons/Icons/Yellow/yellow-code2.svg' }, info: { State: { Autostart: false } } },
            nextcloud: { Labels: { 'net.unraid.docker.icon': '/plugin/images/third-party-icons/Icons/Yellow/yellow-backup.svg' }, info: { State: { Autostart: false } } }
        };
        document.getElementById('docker-start-order-summary').innerHTML = startOrderView.buildHeaderSummaryHtml(startOrderInfo);
        document.getElementById('docker-start-order-workspace').innerHTML = [
            startOrderView.buildControlsHtml({ mode: 'docker-page', remaining: 'after' }),
            startOrderView.buildBatchesHtml([], { folderOptionsCache: { html: '', byId: new Map() }, containerOptionsHtml: '' }),
            `<section id="docker-start-order-preview" class="fv-docker-start-order-preview">${startOrderView.buildPreviewHtml({ managed: true, autostartCount: 5, containerCount: 7, sequence: ['audiobookshelf', 'qbittorrentvpn', 'sonarr', 'radarr', 'prowlarr'].map((name) => ({ name, wait: 0, waitSource: 'native' })) }, { disabledNames: ['adminer', 'nextcloud'], infoByName: startOrderInfo })}</section>`
        ].join('');
        const loadViewSettingsFixture = async () => {
            const source = await fetch('/plugin/FolderViewPlus.page').then((response) => response.text());
            const start = source.indexOf('<details id="docker-view-settings"');
            const end = source.indexOf('</details>', start);
            if (start < 0 || end < 0) throw new Error('Docker view settings panel markup was not found.');
            document.getElementById('view-settings-fixture').innerHTML = source.slice(start, end + '</details>'.length);
            const panel = document.getElementById('docker-view-settings');
            panel.open = true;
            panel.querySelector('[data-filter="all"]')?.classList.add('is-active');
            panel.querySelector('[data-fv-table-preset="docker:balanced"]')?.classList.add('is-active');
            for (const id of [
                'docker-status-trend-row',
                'docker-lazy-preview-threshold-row',
                'docker-dashboard-expand-toggle-row',
                'docker-dashboard-greyscale-row',
                'docker-dashboard-folder-label-row',
                'docker-dashboard-preview-trigger-row',
                'docker-dashboard-preview-graph-row',
                'docker-dashboard-preview-graph-time-row'
            ]) document.getElementById(id)?.classList.add('is-hidden');
            panel.querySelectorAll('input[type="checkbox"]').forEach((input) => { input.checked = true; });
            document.getElementById('docker-hide-empty-folders').checked = false;
            document.getElementById('docker-status-warn-threshold').value = '60';
            document.getElementById('docker-health-warn-threshold').value = '60';
            document.getElementById('docker-health-critical-threshold').value = '90';
            document.getElementById('docker-live-refresh-seconds').value = '20';
            panel.querySelectorAll('[data-fv-number-target]').forEach((range) => {
                range.value = document.getElementById(range.dataset.fvNumberTarget)?.value || range.value;
            });
            return panel;
        };
        const diagnosticsModel = window.FolderViewPlusDiagnosticsViewModel.buildDiagnosticsViewModel({
            hasResults: true,
            checkedAt: new Date().toISOString(),
            checkedAtLabel: 'just now',
            pluginVersion: 'fixture',
            coreCards: [
                { key: 'docker', label: 'Docker config', status: 'healthy', headline: 'No issues detected.' },
                { key: 'vm', label: 'VM config', status: 'healthy', headline: 'No issues detected.' },
                { key: 'storage', label: 'Storage and paths', status: 'healthy', headline: 'Paths look healthy.' },
                { key: 'custom_icons', label: 'Custom icons', status: 'healthy', headline: 'Custom icon storage looks healthy.' },
                { key: 'update', label: 'Update check', status: 'healthy', headline: 'Plugin is up to date.' },
                { key: 'theme', label: 'Theme', status: 'healthy', headline: 'Theme diagnostics look healthy.' }
            ],
            advisoryCards: [
                { key: 'performance_budget', label: 'Performance advisories', status: 'healthy', headline: 'Within budget.', technicalDetails: ['Timing detail'] }
            ],
            additionalCards: [
                { key: 'localization', label: 'Localization', status: 'info', headline: 'Catalog loaded.', technicalDetails: ['Catalog detail'] }
            ]
        });
        window.FolderViewPlusDiagnosticsView.createApi({
            escapeHtml: (value) => String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;'),
            svgIcon: window.FolderViewPlusUI.svgIcon
        }).render(document.getElementById('fv-diagnostics-summary'), diagnosticsModel);
        const supportBundlePreview = window.FolderViewPlusSupportBundlePreview.createApi({
            svgIcon: window.FolderViewPlusUI.svgIcon
        });
        const supportFixtureBundle = {
            bundleMeta: {
                privacyMode: 'sanitized',
                bundleVersion: 2,
                generatedAt: '2026-07-24T22:05:24Z'
            },
            system: {},
            pluginState: {},
            runtimeState: {},
            uiTelemetry: {},
            healthAndHistory: {},
            redactionManifest: {
                hashedFields: ['one'],
                maskedFields: ['two'],
                omittedFields: ['three'],
                truncatedFields: ['four']
            }
        };
        document.getElementById('fv-support-visual-fixture').innerHTML = `
            <div class="fv-diagnostics-support-grid">
                <article class="fv-diagnostics-capture-card">
                    <div class="fv-diagnostics-support-card-head">
                        <div>${window.FolderViewPlusUI.svgIcon('monitor')}<strong>Dashboard visual evidence</strong></div>
                    </div>
                    <p>Captured Dashboard geometry remains available for support review.</p>
                    <div class="fv-support-bundle-capture-rows">
                        <div class="fv-support-bundle-capture-row is-ready">
                            <strong>Docker Dashboard</strong>
                            <span>fresh; under 1 min old; 1920 x 1080; render healthy.</span>
                        </div>
                    </div>
                    <a class="fv-ui-button fv-dashboard-capture-guide-action" href="/Dashboard">Capture again</a>
                </article>
                ${supportBundlePreview.buildSupportBundleOverviewHtml(supportFixtureBundle)}
            </div>
            <div class="fv-support-bundle-redaction-card">
                ${supportBundlePreview.buildSupportBundleRedactionPreviewHtml(supportFixtureBundle)}
            </div>
        `;
        window.fixtureSettings = {
            ready: true,
            viewSettingsReady: loadViewSettingsFixture(),
            diagnosticsReady: Promise.resolve(diagnosticsModel)
        };
    </script>
</body>
</html>
