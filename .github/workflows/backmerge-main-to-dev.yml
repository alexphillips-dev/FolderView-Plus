name: Back-Merge Main To Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: folderview-plus-backmerge-main-to-dev
  cancel-in-progress: false

jobs:
  backmerge:
    runs-on: ubuntu-latest
    env:
      BACKMERGE_BRANCH: backmerge/main-to-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The sync script needs both branch histories and their merge base.
          fetch-depth: 0

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync main into dev
        run: |
          bash scripts/sync_main_to_dev.sh

      - name: Validate merged dev state before push
        env:
          FVPLUS_EXPECT_PLUGIN_BRANCH: 'dev'
          FVPLUS_ALLOW_PACKAGED_SOURCE_DRIFT: '1'
          FVPLUS_UNRAID_MATRIX: ${{ secrets.FVPLUS_UNRAID_MATRIX }}
          FVPLUS_I18N_STRICT: '1'
          FVPLUS_DEAD_CODE_STRICT: '1'
          FVPLUS_REQUIRE_PERF_BASELINE: '1'
          FVPLUS_BROWSER_SMOKE_URL: ${{ secrets.FVPLUS_BROWSER_SMOKE_URL }}
          FVPLUS_BROWSER_SMOKE_REQUIRED: '0'
          FVPLUS_BROWSER_SMOKE_TIMEOUT_MS: '90000'
          FVPLUS_BROWSER_SMOKE_IGNORE_HTTPS: '1'
          FVPLUS_BROWSER_SMOKE_REQUIRE_FOLDER_EDITOR: '1'
          FVPLUS_BROWSER_SMOKE_REQUIRE_RUNTIME_ROWS: '1'
          FVPLUS_BROWSER_SMOKE_RUNTIME_GAP_MAX: '30'
          FVPLUS_BROWSER_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/tmp/browser-smoke-artifacts
          FVPLUS_THEME_MATRIX_URLS: ${{ secrets.FVPLUS_THEME_MATRIX_URLS }}
          FVPLUS_THEME_MATRIX_REQUIRED: '0'
          FVPLUS_THEME_REQUIRED_LABELS: 'black,white'
          FVPLUS_THEME_SMOKE_TIMEOUT_MS: '90000'
          FVPLUS_THEME_SMOKE_IGNORE_HTTPS: '1'
          FVPLUS_THEME_SMOKE_BROWSERS: 'chromium,firefox,webkit'
          FVPLUS_THEME_SMOKE_ZOOMS: '1,1.25,1.5'
          FVPLUS_THEME_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/tmp/browser-smoke-artifacts/theme-matrix
          FVPLUS_FIXTURE_BROWSERS: 'chromium,firefox,webkit'
          FVPLUS_FIXTURE_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/tmp/fixture-browser-artifacts
          FVPLUS_PLAYWRIGHT_INSTALL_WITH_DEPS: '1'
        run: |
          chmod +x scripts/run_ci_suite.sh
          bash scripts/run_ci_suite.sh

      - name: Push back-merge branch when updated
        id: push_backmerge
        run: |
          git fetch origin dev "${BACKMERGE_BRANCH}" || true
          LOCAL_DEV="$(git rev-parse dev)"
          REMOTE_DEV="$(git rev-parse origin/dev)"
          if [ "${LOCAL_DEV}" = "${REMOTE_DEV}" ]; then
            echo "No dev changes produced by back-merge."
            echo "updated=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git push --force-with-lease origin dev:"${BACKMERGE_BRANCH}"
          echo "updated=1" >> "${GITHUB_OUTPUT}"

      - name: Create or update back-merge PR
        if: steps.push_backmerge.outputs.updated == '1'
        env:
          GH_TOKEN: ${{ secrets.FVPLUS_BACKMERGE_TOKEN || github.token }}
          BACKMERGE_TOKEN_SOURCE: ${{ secrets.FVPLUS_BACKMERGE_TOKEN != '' && 'FVPLUS_BACKMERGE_TOKEN' || 'GITHUB_TOKEN' }}
        run: |
          set -euo pipefail
          TITLE="Sync main into dev"
          BODY_FILE="$(mktemp)"
          MANUAL_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/dev...${GITHUB_REPOSITORY_OWNER}:${BACKMERGE_BRANCH}?expand=1"
          report_pr_failure() {
            local reason="$1"
            {
              echo "## Back-merge follow-up required"
              echo
              echo "The validated branch \`${BACKMERGE_BRANCH}\` was pushed, but the workflow could not create or update its pull request using \`${BACKMERGE_TOKEN_SOURCE}\`."
              echo
              echo "Reason: ${reason}"
              echo
              echo "[Open the back-merge pull request manually](${MANUAL_URL})"
              echo
              echo "Repository administrators can enable **Allow GitHub Actions to create and approve pull requests**, or configure the \`FVPLUS_BACKMERGE_TOKEN\` repository secret with pull-request access."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error title=Back-merge PR was not created::${reason}. The validated ${BACKMERGE_BRANCH} branch is available; use ${MANUAL_URL}"
            exit 1
          }
          cat > "${BODY_FILE}" <<'EOF'
          ## Summary

          Automated back-merge of main-only fixes into `dev`.

          This PR contains the commits present on `main` but not on `dev`, excluding stable release artifacts:
          - `folderview.plus.plg`
          - `folderview.plus.xml`
          - `archive/*.txz`
          - `archive/*.sha256`
          EOF

          set +e
          EXISTING_PR="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f base=dev \
              -f head="${GITHUB_REPOSITORY_OWNER}:${BACKMERGE_BRANCH}" \
              --jq '.[0].number // empty'
          )"
          LOOKUP_STATUS=$?
          set -e
          if [ "${LOOKUP_STATUS}" -ne 0 ]; then
            report_pr_failure "GitHub rejected the lookup for an existing back-merge pull request"
          fi

          set +e
          if [ -n "${EXISTING_PR}" ]; then
            PR_URL="$(
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${EXISTING_PR}" \
                -f title="${TITLE}" \
                -f body="$(cat "${BODY_FILE}")" \
                --jq '.html_url'
            )"
            STATUS=$?
            if [ "${STATUS}" -eq 0 ]; then
              echo "Updated back-merge PR #${EXISTING_PR}: ${PR_URL}"
            fi
          else
            PR_URL="$(
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
                -f title="${TITLE}" \
                -f head="${BACKMERGE_BRANCH}" \
                -f base=dev \
                -f body="$(cat "${BODY_FILE}")" \
                --jq '.html_url'
            )"
            STATUS=$?
            if [ "${STATUS}" -eq 0 ]; then
              echo "Created back-merge PR from ${BACKMERGE_BRANCH} into dev: ${PR_URL}"
            fi
          fi
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            report_pr_failure "GitHub rejected the back-merge pull-request create or update operation"
          fi
          if [ -z "${PR_URL:-}" ]; then
            report_pr_failure "GitHub returned no pull-request URL after the create or update operation"
          fi

          {
            echo "## Back-merge pull request ready"
            echo
            echo "${PR_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect back-merge debug artifacts on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/backmerge-debug
          git status --short --branch > tmp/backmerge-debug/git-status.txt || true
          git diff --stat > tmp/backmerge-debug/git-diff-stat.txt || true
          git log --oneline --decorate -10 > tmp/backmerge-debug/git-log.txt || true

      - name: Upload back-merge debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backmerge-debug-${{ github.run_id }}-${{ github.job }}
          if-no-files-found: ignore
          path: |
            tmp/backmerge-debug/**
            tmp/browser-smoke-artifacts/**
            tmp/fixture-browser-artifacts/**
            *.log
            scripts/*.log
