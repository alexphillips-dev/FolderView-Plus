<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FolderView Plus Dashboard layout fixture</title>
    <link rel="stylesheet" href="/plugin/styles/theme.tokens.css">
    <link rel="stylesheet" href="/plugin/styles/ui.primitives.css">
    <link rel="stylesheet" href="/plugin/styles/dashboard.css">
    <style>
        body { margin: 12px; background: #171717; color: #f3f3f3; font: 16px/1.35 Arial, sans-serif; }
        #fixture-widget { width: 1180px; max-width: 100%; }
        #fixture-widget table { width: 100%; table-layout: fixed; border-collapse: collapse; }
        #fixture-widget td { padding: 0; }
        .folder-showcase-outer > span.outer { display: flex; min-height: 50px; padding: 6px; background: #242424; }
        .folder-showcase > span.outer { min-height: 74px; padding: 6px; background: #292929; }
        .folder-showcase .img { width: 42px; height: 42px; flex: 0 0 42px; background: #4779aa; }
    </style>
</head>
<body>
    <section id="fixture-widget">
        <input id="apps" type="checkbox" hidden>
        <table>
            <tbody id="docker_view">
                <tr class="updated">
                    <td id="fixture-dashboard-host">
                        <div class="folder-showcase-outer" data-fv-folder-id="system" expanded="true">
                            <span class="outer apps folder-docker"><span class="inner folder-inner-docker"><span class="folder-appname-docker">System</span></span></span>
                            <div class="folder-showcase">
                                <span id="fixture-running-member" class="outer apps started folder-element-docker" data-fv-runtime-state="running"><span class="img"></span><span class="inner"><a class="appname">Docker-Socket-Proxy</a><br><span>Started</span></span></span>
                                <span id="fixture-stopped-member" class="outer apps stopped folder-element-docker" data-fv-runtime-state="stopped"><span class="img"></span><span class="inner"><a class="appname">VideoDuplicateFinder</a><br><span>Gestoppt</span></span></span>
                                <span id="fixture-paused-member" class="outer apps paused folder-element-docker" data-fv-runtime-state="paused"><span class="img"></span><span class="inner"><a class="appname">VM-Custom-Icons</a><br><span>Pausiert</span></span></span>
                            </div>
                        </div>
                        <div id="fixture-stopped-folder" class="folder-showcase-outer" data-fv-folder-id="media" expanded="true"><span class="outer apps stopped folder-docker"><span class="inner folder-inner-docker"><span class="folder-appname-docker">Medien und Automatisierung</span></span></span><div class="folder-showcase"><span id="fixture-only-stopped-member" class="outer apps stopped folder-element-docker" data-fv-runtime-state="stopped"><span class="img"></span><span class="inner"><a class="appname">Open-Archiver</a></span></span></div></div>
                        <div class="folder-showcase-outer" data-fv-folder-id="utilities" expanded="false"><span class="outer apps folder-docker"><span class="inner folder-inner-docker"><span class="folder-appname-docker">Utilities</span></span><div class="folder-storage"><span id="fixture-collapsed-stopped-member" class="outer apps stopped folder-element-docker" data-fv-runtime-state="stopped"><span class="inner"><a class="appname">Stopped Utility</a></span></span></div></span><div class="folder-showcase"></div></div>
                        <div class="folder-showcase-outer" data-fv-folder-id="network" expanded="false"><span class="outer apps folder-docker"><span class="inner folder-inner-docker"><span class="folder-appname-docker">Network</span></span></span><div class="folder-showcase"></div></div>
                        <div id="fixture-nested-parent" class="folder-showcase-outer" data-fv-folder-id="storage" expanded="false"><span class="outer apps folder-docker"><span class="inner folder-inner-docker"><span class="folder-appname-docker">Storage</span></span></span><div class="folder-showcase"><div id="fixture-nested-running-folder" class="folder-showcase-outer" data-fv-folder-id="storage-child" expanded="false"><span class="outer apps started folder-docker"><span class="inner folder-inner-docker"><span class="folder-appname-docker">Storage child</span></span><div class="folder-storage"><span class="outer apps started folder-element-docker" data-fv-runtime-state="running"><span class="inner"><a class="appname">Running storage service</a></span></span></div></span><div class="folder-showcase"></div></div></div></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
    <section id="fixture-vm-widget" hidden>
        <input id="vms" type="checkbox">
        <table><tbody id="vm_view"><tr class="updated"><td>
            <div id="fixture-vm-folder" class="folder-showcase-outer" data-fv-folder-id="vm-system" expanded="true">
                <span class="outer vms folder-vm"><span class="inner folder-inner-vm"><span class="folder-appname-vm">VM System</span></span></span>
                <div class="folder-showcase">
                    <span id="fixture-vm-running" class="outer vms started folder-element-vm" data-fv-runtime-state="running"><span class="inner">Running VM</span></span>
                    <span id="fixture-vm-paused" class="outer vms paused folder-element-vm" data-fv-runtime-state="paused"><span class="inner">Paused VM</span></span>
                    <span id="fixture-vm-stopped" class="outer vms stopped folder-element-vm" data-fv-runtime-state="shutoff"><span class="inner">Stopped VM</span></span>
                </div>
            </div>
        </td></tr></tbody></table>
    </section>
    <script src="/vendor/jquery.js"></script>
    <script src="/plugin/scripts/folderviewplus.ui.js"></script>
    <script src="/plugin/scripts/dashboard.layout-quickrail.js"></script>
    <script src="/plugin/scripts/dashboard.visual-diagnostics.js?v=fixture"></script>
    <script src="/fixtures/dashboard-layout.fixture.js"></script>
</body>
</html>
