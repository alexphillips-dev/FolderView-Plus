name: Bug report
description: Report a reproducible bug, regression, or compatibility issue in FolderView Plus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please include only the details needed to reproduce the issue quickly.

        This issue is public. Export a **sanitized** support bundle before refreshing the affected page when possible, review its preview, and never attach credentials, tokens, cookies, private URLs, a full/unsanitized bundle, or a raw configuration export.

  - type: checkboxes
    id: precheck
    attributes:
      label: Pre-check
      options:
        - label: I searched existing issues and did not find an open duplicate.
          required: true
        - label: I reproduced this on the latest stable release, or I entered the exact requested dev/commit-specific version below.
          required: true

  - type: input
    id: unraid_version
    attributes:
      label: Unraid version
      placeholder: "e.g. 7.2.4"
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: FolderView Plus version
      placeholder: "e.g. 2026.03.13.17"
    validations:
      required: true

  - type: dropdown
    id: release_channel
    attributes:
      label: Installed release channel
      options:
        - Stable / main
        - Dev testing build
        - Commit-specific build
        - Local or manually modified package
        - Unknown
    validations:
      required: true

  - type: input
    id: browser_device
    attributes:
      label: Browser and device
      description: Required for UI, wizard, mobile, and rendering issues.
      placeholder: "e.g. Chrome 134 on Windows desktop, Safari on iPhone 15"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Install/update method
      options:
        - Community Applications
        - plugin install (stable/main URL)
        - plugin install (dev URL)
        - plugin install (commit-specific URL)
        - Local file/manual
        - Other
    validations:
      required: true

  - type: dropdown
    id: access_method
    attributes:
      label: How do you access Unraid?
      options:
        - Direct LAN IP
        - Local hostname
        - Reverse proxy or custom domain
        - Unraid Connect
        - Tailscale or another VPN
        - Other or unsure
    validations:
      required: true

  - type: dropdown
    id: docker_view_mode
    attributes:
      label: Unraid Docker view mode
      description: Select Not applicable when this is not a Docker-page issue.
      options:
        - Basic View
        - Advanced View
        - Tested in both
        - Not applicable
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: theme_context
    attributes:
      label: Theme or custom styling active?
      options:
        - None (stock Unraid theme)
        - Unraid theme engine / custom theme
        - Custom CSS/JS overrides
        - Both theme engine and custom CSS/JS
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: conflict_plugins
    attributes:
      label: Other Folder View plugins installed?
      options:
        - No
        - Yes (FolderView3)
        - Yes (FolderView2)
        - Yes (multiple)
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: configuration_origin
    attributes:
      label: Configuration origin
      options:
        - Fresh FolderView Plus configuration
        - Upgraded from an earlier FolderView Plus version
        - Imported from FolderView3
        - Imported from FolderView2
        - Restored from a backup or export
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Docker tab rendering
        - Docker container actions / context menus
        - Docker API / provider compatibility
        - Unraid native Docker / prerelease compatibility
        - VM tab rendering
        - Dashboard widgets
        - Settings basic view
        - Settings advanced modules
        - Setup wizard
        - Nested folders / tree operations
        - Import/export / backup restore
        - Auto-assignment rules
        - Custom icon upload/third-party icons
        - Safe mode / conflict detection
        - Mobile / touch behavior
        - Install / update detection
        - Reverse proxy / request guard
        - Diagnostics / support bundles
        - Docker Start Order
        - Plugin lifecycle / installation / updates
        - Privacy / security behavior
        - Other
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Always
        - Intermittent
        - Once so far
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Provide exact steps from a clean page load.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: relevant_settings
    attributes:
      label: Relevant FolderView Plus settings
      description: List settings related to the problem, such as Preview style, Preview Rows, overflow behavior, context mode, nested-folder visibility, hide-empty folders, Performance Mode, view mode, sorting, or custom colors.
      placeholder: "Example: Preview Rows = Unlimited; Context = Advanced; parent folder contains one child folder"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / console output
      description: Include only the relevant snippet. For install/update/import issues, include exact terminal output.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: support_bundle_status
    attributes:
      label: Sanitized support bundle status
      description: Export from Settings -> FolderView Plus -> Advanced -> Diagnostics and review the preview before sharing.
      options:
        - Attached below
        - Unable to export because Settings or Diagnostics will not load
        - Unable to export because installation failed
        - Not applicable to this report
        - Need instructions
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments (optional but helpful)
      description: Drag and drop screenshots, recordings, or a sanitized support bundle. Do not attach a full/unsanitized bundle or raw configuration export publicly.
    validations:
      required: false

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: Public attachment confirmation
      options:
        - label: I reviewed my attachments and removed credentials, tokens, cookies, private URLs, unsanitized diagnostics, and raw configuration exports.
          required: true
