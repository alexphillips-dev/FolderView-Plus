name: Translation contribution
description: Add, complete, or review a FolderView Plus language.
title: "[Translation]: "
labels:
  - translation
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve FolderView Plus. Check the [Translation and Accessibility Wiki page](https://github.com/alexphillips-dev/FolderView-Plus/wiki/Translation-and-Accessibility) for terminology, placeholders, review expectations, and right-to-left guidance.

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Arabic (ar)
        - Bengali (bn)
        - Catalan (ca)
        - Chinese - Simplified (zh-Hans)
        - Chinese - Traditional (zh-Hant)
        - Croatian (hr)
        - Czech (cs)
        - Danish (da)
        - Dutch (nl)
        - French (fr)
        - German (de)
        - Hungarian (hu)
        - Italian (it)
        - Japanese (ja)
        - Korean (ko)
        - Latvian (lv)
        - Norwegian Bokmål (nb)
        - Polish (pl)
        - Portuguese - Brazil (pt-BR)
        - Portuguese - Portugal (pt-PT)
        - Romanian (ro)
        - Russian (ru)
        - Spanish (es)
        - Swedish (sv)
        - Turkish (tr)
        - Ukrainian (uk)
        - Another locale or regional variant
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution type
      options:
        - New translation
        - Complete a partial translation
        - Human review
        - Terminology correction
        - Layout or RTL issue
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: UI context and proposed wording
      description: Identify the page, control, message key, and intended wording. Include screenshots where layout matters.
    validations:
      required: true
  - type: checkboxes
    id: review
    attributes:
      label: Review confirmation
      options:
        - label: I can judge this language fluently in the supplied UI context.
          required: true
        - label: I preserved placeholders such as $1, plural syntax, supported HTML, and FolderView Plus product terminology.
          required: true
        - label: I identified any destructive action wording that needs a second reviewer.
          required: true
