name: Support / troubleshooting
description: Get help with install, update visibility, configuration, or usage
title: "[Support]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for setup/help questions. For confirmed bugs, use the Bug report form instead.

        This issue is public. Export a **sanitized** support bundle when possible, review its preview, and never attach credentials, tokens, cookies, private URLs, a full/unsanitized bundle, or a raw configuration export.

  - type: dropdown
    id: help_topic
    attributes:
      label: What do you need help with?
      options:
        - Plugin installation
        - Plugin update not showing
        - Folders not visible
        - Nested folders / tree behavior
        - Setup wizard behavior
        - Import/Export behavior
        - Backup restore behavior
        - Folder ordering
        - Docker or VM actions / context menus
        - Auto-assignment rules
        - Custom icon upload or icon packs
        - Safe mode / conflict banner
        - Mobile/touch layout
        - UI/settings behavior
        - Reverse proxy or custom hostname
        - Diagnostics or support-bundle export
        - Docker Start Order
        - Unraid compatibility
        - Performance or refresh behavior
        - Privacy or security behavior
        - Other
    validations:
      required: true

  - type: input
    id: unraid_version
    attributes:
      label: Unraid version
      placeholder: "e.g. 7.1.4"
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: FolderView Plus version
      placeholder: "e.g. 2026.03.05.4 or unknown"
    validations:
      required: true

  - type: dropdown
    id: release_channel
    attributes:
      label: Installed release channel
      options:
        - Stable / main
        - Dev testing build
        - Commit-specific build
        - Local or manually modified package
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Install source
      options:
        - Community Applications
        - plugin install (stable/main URL)
        - plugin install (dev URL)
        - plugin install (commit-specific URL)
        - Local file/manual
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: access_method
    attributes:
      label: How do you access Unraid?
      options:
        - Direct LAN IP
        - Local hostname
        - Reverse proxy or custom domain
        - Unraid Connect
        - Tailscale or another VPN
        - Other or unsure
    validations:
      required: true

  - type: dropdown
    id: docker_view_mode
    attributes:
      label: Unraid Docker view mode
      description: Select Not applicable when this is not a Docker-page question.
      options:
        - Basic View
        - Advanced View
        - Tested in both
        - Not applicable
        - Unsure
    validations:
      required: true

  - type: input
    id: browser_device
    attributes:
      label: Browser and device
      description: Required for UI, wizard, dashboard, and mobile issues.
      placeholder: "e.g. Chrome 134 on Windows desktop, Safari on iPhone 15"
    validations:
      required: true

  - type: dropdown
    id: theme_context
    attributes:
      label: Theme or custom styling active?
      options:
        - None (stock Unraid theme)
        - Unraid theme engine / custom theme
        - Custom CSS/JS overrides
        - Both theme engine and custom CSS/JS
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: conflict_plugins
    attributes:
      label: Other Folder View plugins installed?
      options:
        - No
        - Yes (FolderView3)
        - Yes (FolderView2)
        - Yes (multiple)
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: configuration_origin
    attributes:
      label: Configuration origin
      options:
        - Fresh FolderView Plus configuration
        - Upgraded from an earlier FolderView Plus version
        - Imported from FolderView3
        - Imported from FolderView2
        - Restored from a backup or export
        - Unsure
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What you see now.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: troubleshooting_tried
    attributes:
      label: What you already tried
      description: Include exact commands/steps, hard refresh, reinstall attempts, and import/restore attempts if relevant.
      render: shell
    validations:
      required: true

  - type: textarea
    id: relevant_settings
    attributes:
      label: Relevant FolderView Plus settings
      description: List settings related to the question, such as Preview style, Preview Rows, overflow behavior, context mode, nested-folder visibility, hide-empty folders, Performance Mode, view mode, sorting, or custom colors.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Optional terminal output, plugin install output, or browser console logs.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: support_bundle_status
    attributes:
      label: Sanitized support bundle status
      description: Export from Settings -> FolderView Plus -> Advanced -> Diagnostics and review the preview before sharing.
      options:
        - Attached below
        - Unable to export because Settings or Diagnostics will not load
        - Unable to export because installation failed
        - Not applicable to this request
        - Need instructions
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments (optional but helpful)
      description: Drag and drop screenshots, recordings, or a sanitized support bundle. Do not attach a full/unsanitized bundle or raw configuration export publicly.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I reviewed the Wiki and troubleshooting guidance before filing this support request.
          required: true
        - label: I reviewed my attachments and removed credentials, tokens, cookies, private URLs, unsanitized diagnostics, and raw configuration exports.
          required: true
