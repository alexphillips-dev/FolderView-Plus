name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [auto, release, exhaustive]
        default: auto
      benchmarks:
        type: boolean
        default: false
      base_sha:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: folderview-plus-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FVPLUS_EXPECT_PLUGIN_BRANCH: ${{ startsWith(github.ref_name, 'fvplus-release-candidate-') && 'main' || startsWith(github.ref_name, 'fvplus-sync-candidate-') && 'dev' || '' }}
  FVPLUS_I18N_STRICT: '1'
  FVPLUS_DEAD_CODE_STRICT: '1'
  FVPLUS_REQUIRE_PERF_BASELINE: '1'
  FVPLUS_MAIN_HISTORY_BASE_REF: ${{ github.event.before }}
  FVPLUS_PLAYWRIGHT_INSTALL_WITH_DEPS: '1'
  FVPLUS_PLAYWRIGHT_SKIP_BROWSER_INSTALL_IF_CACHED: '1'
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      no_changes: ${{ steps.classify.outputs.no_changes }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      workflow_only: ${{ steps.classify.outputs.workflow_only }}
      needs_browser: ${{ steps.classify.outputs.needs_browser }}
      needs_theme: ${{ steps.classify.outputs.needs_theme }}
      needs_performance: ${{ steps.classify.outputs.needs_performance }}
      preview_changed: ${{ steps.classify.outputs.preview_changed }}
      release_profile: ${{ steps.profile.outputs.release == 'true' || steps.evidence.outputs.reused == 'true' }}
      reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Select validation profile
        id: profile
        env:
          PROFILE: ${{ inputs.profile || 'auto' }}
        run: |
          release=false
          if [[ "$PROFILE" == release || ("$GITHUB_REF_NAME" == main && "$GITHUB_EVENT_NAME" == push) ]]; then release=true; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Classify changed paths
        id: classify
        env:
          FVPLUS_CI_EVENT_NAME: ${{ github.event_name }}
          FVPLUS_CI_BEFORE_SHA: ${{ github.event.before }}
          FVPLUS_CI_HEAD_SHA: ${{ github.sha }}
          FVPLUS_CI_BASE_SHA: ${{ inputs.base_sha }}
        run: node scripts/classify_ci_changes.mjs
      - name: Find exact candidate validation
        id: evidence
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release_validation.mjs find

  lint-and-syntax:
    needs: detect-changes
    if: needs.detect-changes.outputs.reused != 'true' && (needs.detect-changes.outputs.no_changes != 'true' || needs.detect-changes.outputs.release_profile == 'true') && (needs.detect-changes.outputs.docs_only != 'true' || needs.detect-changes.outputs.release_profile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-ci-env
      - name: Run validation lane
        run: |
          bash scripts/run_ci_suite.sh --lane lint

  node-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.reused != 'true' && (needs.detect-changes.outputs.no_changes != 'true' || needs.detect-changes.outputs.release_profile == 'true') && (needs.detect-changes.outputs.docs_only != 'true' || needs.detect-changes.outputs.release_profile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-ci-env
      - name: Run validation lane
        run: |
          npm ci --ignore-scripts
          if [[ "${{ needs.detect-changes.outputs.workflow_only }}" == true && "${{ needs.detect-changes.outputs.release_profile }}" != true ]]; then
            bash scripts/run_ci_suite.sh --lane workflow-tests
          else
            bash scripts/run_ci_suite.sh --lane tests
          fi

  guard-suite:
    name: CI tests and guards
    needs: detect-changes
    if: needs.detect-changes.outputs.reused != 'true' && (needs.detect-changes.outputs.no_changes != 'true' || needs.detect-changes.outputs.release_profile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-ci-env
      - name: Run validation lane
        run: |
          if [[ "${{ needs.detect-changes.outputs.release_profile }}" == true ]]; then
            bash scripts/run_ci_suite.sh --lane guards
          elif [[ "${{ needs.detect-changes.outputs.docs_only }}" == true ]]; then
            bash scripts/run_ci_suite.sh --lane docs-guards
          elif [[ "${{ needs.detect-changes.outputs.workflow_only }}" == true ]]; then
            bash scripts/run_ci_suite.sh --lane workflow-guards
          else
            bash scripts/run_ci_suite.sh --lane guards
          fi

  dependency-review:
    # Preserve the protected check on candidate tags without duplicating PR checks.
    name: ${{ (startsWith(github.ref_name, 'fvplus-release-candidate-') || startsWith(github.ref_name, 'fvplus-sync-candidate-')) && 'Dependency Review' || 'Release dependency policy' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.reused != 'true' && needs.detect-changes.outputs.release_profile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Resolve dependency comparison
        id: refs
        env:
          BASE_REF: ${{ inputs.base_sha || github.event.before }}
        run: |
          if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            git fetch --filter=blob:none --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
            BASE_REF=$(git rev-parse origin/main)
          fi
          [[ "$BASE_REF" =~ ^[a-f0-9]{40}$ ]]
          echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"
      - name: Enforce dependency vulnerability and license policy
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          base-ref: ${{ steps.refs.outputs.base }}
          head-ref: ${{ github.sha }}
          fail-on-severity: high
          license-check: true
          allow-licenses: Apache-2.0, BSD-3-Clause, BlueOak-1.0.0, ISC, MIT, MPL-2.0
          retry-on-snapshot-warnings: true
          warn-only: false
  fixture-browser:
    needs: detect-changes
    if: needs.detect-changes.outputs.reused != 'true' && (needs.detect-changes.outputs.needs_browser == 'true' || needs.detect-changes.outputs.release_profile == 'true')
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-ci-env
        with:
          browsers: ${{ matrix.browser }}
      - name: Run required fixture browser suite
        env:
          FVPLUS_FIXTURE_BROWSERS: ${{ matrix.browser }}
          FVPLUS_FIXTURE_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/tmp/fixture-browser-artifacts
        run: bash scripts/run_ci_suite.sh --lane fixture-browser
      - name: Upload fixture browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-fixture-browser-${{ github.run_id }}-${{ matrix.browser }}
          path: tmp/fixture-browser-artifacts/**
          if-no-files-found: error
          retention-days: 7
  layout-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.reused != 'true' && (needs.detect-changes.outputs.needs_theme == 'true' || needs.detect-changes.outputs.release_profile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-ci-env
        with:
          browsers: chromium
      - run: bash scripts/run_ci_suite.sh --lane layout-checks
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ci-layout-${{ github.run_id }}
          path: tmp/fixture-browser-artifacts/**
          if-no-files-found: error
  performance:
    needs: detect-changes
    if: needs.detect-changes.outputs.reused != 'true' && (needs.detect-changes.outputs.needs_performance == 'true' || inputs.benchmarks == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FVPLUS_SKIP_DOCKER_BENCHMARK: ${{ vars.FVPLUS_SKIP_DOCKER_BENCHMARK || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-ci-env
        with:
          browsers: chromium
      - run: bash scripts/run_ci_suite.sh --lane performance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ci-performance-${{ github.run_id }}
          path: tmp/fixture-browser-artifacts/**
  theme-matrix:
    if: inputs.profile == 'exhaustive' && vars.FVPLUS_SKIP_THEME_MATRIX != '1'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-ci-env
        with:
          browsers: ${{ matrix.browser }}
      - name: Run exhaustive theme matrix
        env:
          FVPLUS_THEME_SMOKE_BROWSERS: ${{ matrix.browser }}
          FVPLUS_THEME_SMOKE_ARTIFACT_DIR: tmp/fixture-browser-artifacts/theme-matrix
        run: bash scripts/run_ci_suite.sh --lane theme-matrix
      - name: Upload synthetic theme artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exhaustive-layout-${{ github.run_id }}-${{ matrix.browser }}
          path: tmp/fixture-browser-artifacts/theme-matrix/**
          if-no-files-found: error
          retention-days: 7
  release-preview:
    needs: [detect-changes, lint-and-syntax, node-tests, guard-suite]
    if: github.event_name == 'push' && github.ref_name == 'dev' && needs.detect-changes.outputs.preview_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-ci-env
      - run: bash pkg_build.sh --no-validate
      - name: Build preview release notes
        run: |
          VERSION=$(grep -oP '<!ENTITY version "\K[^"]+' folderview.plus.plg)
          FVPLUS_RELEASE_INSTALL_BRANCH=dev bash scripts/build_release_notes.sh --version "$VERSION" --output release_notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-release-preview-${{ github.run_id }}
          path: |
            archive/*.txz
            archive/*.sha256
            release_notes.md
  quality:
    if: always()
    needs: [detect-changes, lint-and-syntax, node-tests, guard-suite, dependency-review, fixture-browser, layout-checks, performance, theme-matrix, release-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Enforce required CI job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'const results=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(results)) { if(!["success","skipped"].includes(job.result)) throw new Error(name+": "+job.result); } if(results["detect-changes"].result!=="success") throw new Error("Missing classification");'
      - name: Record exact release validation
        if: needs.detect-changes.outputs.release_profile == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FVPLUS_JOB_RESULTS: ${{ toJSON(needs) }}
          FVPLUS_RELEASE_COMPARISON_BASE: ${{ inputs.base_sha || github.event.before }}
          REUSED: ${{ needs.detect-changes.outputs.reused }}
        run: |
          if [[ "$REUSED" == true ]]; then
            node scripts/release_validation.mjs reissue
          else
            node scripts/release_validation.mjs write
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: needs.detect-changes.outputs.release_profile == 'true'
        with:
          name: release-validation-${{ github.sha }}
          path: tmp/release-validation.json
          overwrite: true
          retention-days: 2
          if-no-files-found: error
      - name: Summarize CI duration and lane results
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci_duration_report.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ci-duration-report-${{ github.run_id }}
          path: tmp/ci-duration-report.md
