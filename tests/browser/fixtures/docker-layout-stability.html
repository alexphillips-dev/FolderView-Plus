<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docker layout stability fixture</title>
    <link rel="stylesheet" href="/plugin/styles/docker.css">
    <style>
        body {
            margin: 24px;
            background: #1b1b1b;
            color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .folder-preview {
            display: inline-flex;
            min-height: 28px;
            align-items: center;
        }

        #action-target {
            display: inline-flex;
            align-items: center;
        }

        #width-probe {
            width: var(--fvplus-docker-app-column-width);
            height: 20px;
        }

        .fixture-context-preview {
            display: flex;
            width: 760px;
            min-height: 42px;
            margin-top: 10px;
        }

        .fixture-context-preview .folder-preview-row,
        .fixture-context-preview .folder-preview-wrapper,
        .fixture-context-preview .fv-docker-preview-card {
            display: flex;
            align-items: center;
        }

        .fixture-context-preview .fv-docker-preview-card {
            gap: 6px;
            min-width: 240px;
            min-height: 34px;
            padding: 4px 8px;
        }

        .fixture-context-preview .hand {
            display: inline-flex;
            width: 28px;
            height: 28px;
            background: #777;
        }
    </style>
</head>
<body>
    <div class="folder-preview">
        <span class="appname">Container</span>
        <span id="action-target"></span>
    </div>
    <div id="folder-row" data-fv-folder-id="fixture-folder">
        <span id="folder-context-target" class="folder-hand">
            <span id="folder-context-child">Folder</span>
        </span>
        <a class="folder-appname">Edit</a>
        <button class="folder-dropdown">Toggle</button>
    </div>
    <div id="width-probe"></div>
    <table hidden aria-hidden="true">
        <tbody>
            <tr id="fixture-context-source-rows-2">
                <td class="ct-name">
                    <span class="outer">
                        <span id="fixture-native-rows-2" class="hand" title="Rows 2 native context" onclick="fixtureNativePreviewContext.attach(event, 'rows-2')"><img class="img" alt=""></span>
                        <span class="inner"><span class="appname"><a class="exec" onclick="fixtureNativePreviewContext.edit(event)">Rows 2 app</a></span><br><i id="load-fixture-native-rows-2" class="fa fa-play started green-text"></i><span class="state">started</span></span>
                    </span>
                </td>
            </tr>
            <tr id="fixture-context-source-unlimited">
                <td class="ct-name">
                    <span class="outer">
                        <span id="fixture-native-unlimited" class="hand" title="Unlimited native context" onclick="fixtureNativePreviewContext.attach(event, 'unlimited')"><img class="img" alt=""></span>
                        <span class="inner"><span class="appname"><a class="exec" onclick="fixtureNativePreviewContext.edit(event)">Unlimited app</a></span><br><i id="load-fixture-native-unlimited" class="fa fa-play started green-text"></i><span class="state">started</span></span>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
    <div id="fixture-context-preview-rows-2" class="folder-preview fv-preview-multirow fixture-context-preview" data-preview-rows="2"></div>
    <div id="fixture-context-preview-unlimited" class="folder-preview fv-preview-multirow fv-preview-unlimited-rows fixture-context-preview" data-preview-rows="0"></div>
    <div id="fixture-native-context-menu" hidden>Native context opened</div>
    <table>
        <tbody>
            <tr class="folder-id-fixture-parent">
                <td>
                    <button type="button" class="dropDown-fixture-parent" active="true">Parent</button>
                    <div id="fixture-child-folder-preview" class="folder-preview fv-preview-multirow fixture-context-preview" data-preview-rows="2"></div>
                </td>
            </tr>
            <tr class="folder-id-fixture-child"><td>Child folder row</td></tr>
        </tbody>
    </table>

    <script src="/vendor/jquery.js"></script>
    <script src="/plugin/scripts/runtime.column-layout.js"></script>
    <script src="/plugin/scripts/docker.runtime.preview-actions.js"></script>
    <script src="/plugin/scripts/docker.runtime.child-folder-preview-menu.js"></script>
    <script src="/plugin/scripts/docker.runtime.hierarchy.js"></script>
    <script src="/plugin/scripts/runtime.shared-primitives.js"></script>
    <script src="/plugin/scripts/runtime.shared-diagnostics.js"></script>
    <script src="/plugin/scripts/runtime.shared-controls.js"></script>
    <script src="/plugin/scripts/docker.runtime.shared.js"></script>
    <script src="/plugin/scripts/folder.runtime.row-actions.js"></script>
    <script>
        const actionSettings = {
            preview: 1,
            preview_webui: true,
            preview_console: true,
            preview_logs: true
        };
        const buildDockerPreviewSourceRow = ({ includeOuter = true, includeState = true } = {}) => {
            const stateMarkup = includeState
                ? '<span class="state">started<br>Compose Stack: fixture-stack</span>'
                : '';
            const previewMarkup = includeOuter
                ? `<span class="outer"><span class="hand"><img class="img"></span><span class="inner"><span class="appname"><a class="exec">Fixture app</a></span><br><i class="fa fa-play started"></i>${stateMarkup}</span></span>`
                : '<span class="future-host-name">Fixture app</span>';
            return window.jQuery(`<tr class="sortable"><td class="ct-name">${previewMarkup}</td></tr>`);
        };
        window.fixtureDockerPreviewCloneResilience = {
            run: () => {
                const clonePreview = actionsApi.cloneDockerSingleRowPreviewSource;
                const standardRow = buildDockerPreviewSourceRow();
                const modeOne = clonePreview(
                    standardRow,
                    'td.ct-name > span.outer',
                    { requireState: true, trimStateDetails: true }
                );
                const modeThree = clonePreview(
                    standardRow,
                    'td.ct-name > span.outer > span.inner',
                    { requireState: true, trimStateDetails: true }
                );
                const missingState = clonePreview(
                    buildDockerPreviewSourceRow({ includeState: false }),
                    'td.ct-name > span.outer',
                    { requireState: true, trimStateDetails: true }
                );
                const missingWrapper = clonePreview(
                    buildDockerPreviewSourceRow({ includeOuter: false }),
                    'td.ct-name > span.outer',
                    { requireState: true, trimStateDetails: true }
                );
                const invalidSelector = clonePreview(
                    standardRow,
                    '[',
                    { requireState: true, trimStateDetails: true }
                );
                const renderTarget = window.jQuery('<div></div>');
                let fallbackCount = 0;
                [
                    { row: standardRow, selector: 'td.ct-name > span.outer' },
                    { row: buildDockerPreviewSourceRow({ includeState: false }), selector: 'td.ct-name > span.outer' },
                    { row: buildDockerPreviewSourceRow({ includeOuter: false }), selector: 'td.ct-name > span.outer' }
                ].forEach(({ row, selector }, index) => {
                    actionsApi.renderDockerSingleRowPreview({
                        $sourceRow: row,
                        $preview: renderTarget,
                        selector,
                        previewMode: 1,
                        context: 1,
                        ctid: `fixture-${index}`,
                        appendModelPreview: () => {
                            fallbackCount += 1;
                            const $fallback = window.jQuery('<span class="fixture-model-fallback">Fallback</span>');
                            renderTarget.append($fallback);
                            return $fallback;
                        }
                    });
                });
                return {
                    modeOneOk: modeOne.ok,
                    modeThreeOk: modeThree.ok,
                    modeOneState: modeOne.$clone.find('span.state').text(),
                    modeThreeState: modeThree.$clone.find('span.state').text(),
                    originalState: standardRow.find('span.state').text(),
                    missingState: { ok: missingState.ok, reason: missingState.reason },
                    missingWrapper: { ok: missingWrapper.ok, reason: missingWrapper.reason },
                    invalidSelector: { ok: invalidSelector.ok, reason: invalidSelector.reason },
                    renderedCount: renderTarget.children().length,
                    fallbackCount
                };
            }
        };
        window.localStorage.removeItem(window.FolderViewPlusDockerPreviewActions.PREVIEW_CONTEXT_DIAGNOSTICS_STORAGE_KEY);
        const actionsApi = window.FolderViewPlusDockerPreviewActions.createApi({
            window,
            document,
            $: window.jQuery,
            utils: {
                resolvePreviewActionPrefs: () => ({
                    preview_webui: true,
                    preview_console: true,
                    preview_logs: true
                })
            },
            getSafeWebuiUrl: (value) => /^https?:\/\//.test(String(value || '')) ? String(value) : '',
            openWebuiInNewTab: () => {},
            openTerminal: () => {}
        });
        window.fixtureNativePreviewContext = {
            attachCount: 0,
            openCount: 0,
            editCount: 0,
            quickActionCount: 0,
            lastKey: '',
            lastPoint: null,
            attach(event, key) {
                this.attachCount += 1;
                const triggerId = String(event?.currentTarget?.id || '');
                const namespace = `.fvFixtureNativeContext${String(key || '').replace(/[^a-z0-9]/gi, '')}`;
                window.jQuery(document)
                    .off(`click${namespace}`, `#${triggerId}`)
                    .on(`click${namespace}`, `#${triggerId}`, (openEvent) => {
                        openEvent.preventDefault();
                        openEvent.stopPropagation();
                        this.openCount += 1;
                        this.lastKey = key;
                        this.lastPoint = {
                            clientX: Number(openEvent.clientX || 0),
                            clientY: Number(openEvent.clientY || 0)
                        };
                        document.querySelector('#fixture-native-context-menu').hidden = false;
                    });
            },
            edit(event) {
                event?.preventDefault?.();
                this.editCount += 1;
            },
            reset() {
                this.attachCount = 0;
                this.openCount = 0;
                this.editCount = 0;
                this.quickActionCount = 0;
                this.lastKey = '';
                this.lastPoint = null;
                document.querySelector('#fixture-native-context-menu').hidden = true;
            }
        };
        const buildNativeContextPreview = (key) => {
            const $sourceRow = window.jQuery(`#fixture-context-source-${key}`);
            const $preview = window.jQuery(`#fixture-context-preview-${key}`);
            const runtimeShared = window.FolderViewDockerRuntimeShared;
            const settings = {
                preview_rows: key === 'unlimited' ? 0 : 2,
                preview_vertical_bars: false
            };
            const items = [0, 1].map(() => {
                const $item = $sourceRow.find('td.ct-name > span.outer').first().clone();
                actionsApi.sanitizeDockerPreviewContextClone($item);
                $item.find('br').remove();
                $item.addClass('fv-docker-preview-card fv-docker-preview-card-compact fv-docker-preview-mode-1');
                const $inner = $item.children('span.inner').first();
                const $appName = $inner.children('span.appname').first();
                const $status = window.jQuery('<span class="fv-preview-status-compact"></span>');
                $appName.nextAll().each((_, node) => $status.append(node));
                const $quickActions = window.jQuery('<span class="fv-preview-actions-compact"><span class="folder-element-custom-btn"><button type="button" class="fixture-context-quick-action">Quick action</button></span></span>');
                $quickActions.on('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    window.fixtureNativePreviewContext.quickActionCount += 1;
                });
                $inner.append(window.jQuery('<span class="fv-preview-meta-compact"></span>').append($status, $quickActions));
                actionsApi.normalizeDockerPreviewStatusMarkup($item);
                $preview.append(window.jQuery('<div class="folder-preview-wrapper"></div>').append($item));
                actionsApi.bindDockerPreviewDefaultContextBridge($item, $sourceRow, settings);
                return $item;
            });
            for (let pass = 0; pass < 2; pass += 1) {
                const wrappers = runtimeShared.flattenPreviewWrappers($preview);
                runtimeShared.finalizePreviewRows($preview, wrappers.map((wrapper) => [wrapper]), settings);
                actionsApi.auditDockerPreviewContextBridges($preview, settings);
            }
            return items;
        };
        buildNativeContextPreview('rows-2');
        buildNativeContextPreview('unlimited');
        const childFolderFixtureState = { editCount: 0, actionCount: 0 };
        const childFolderFixtureFolders = {
            'fixture-parent': {
                name: 'Private parent fixture',
                settings: { preview: 1, preview_rows: 2 },
                runtimeContainers: {},
                status: { expanded: false }
            },
            'fixture-child': {
                name: 'Private child fixture',
                icon: '',
                settings: { preview: 1, preview_rows: 2 },
                runtimeContainers: {},
                status: { expanded: false }
            }
        };
        const childFolderFixtureHierarchy = {
            ids: ['fixture-parent', 'fixture-child'],
            parentById: { 'fixture-parent': '', 'fixture-child': 'fixture-parent' },
            childrenById: { 'fixture-parent': ['fixture-child'], 'fixture-child': [] }
        };
        const layoutChildFolderFixtureRows = ($preview, settings) => {
            const runtimeShared = window.FolderViewDockerRuntimeShared;
            const wrappers = runtimeShared.flattenPreviewWrappers($preview);
            runtimeShared.finalizePreviewRows($preview, wrappers.map((wrapper) => [wrapper]), settings);
        };
        const childFolderHierarchyApi = window.FolderViewPlusDockerRuntimeHierarchy.createApi({
            window,
            $: window.jQuery,
            getGlobalFolders: () => childFolderFixtureFolders,
            getDockerFolderHierarchy: () => childFolderFixtureHierarchy,
            buildRuntimeContainerMapForFolder: (folderId, includeDescendants) => {
                if (folderId === 'fixture-child') {
                    return { childMember: { name: 'Private child member', state: true } };
                }
                if (folderId === 'fixture-parent' && includeDescendants !== true) {
                    return {
                        parentMemberOne: { name: 'Private parent member one', state: true },
                        parentMemberTwo: { name: 'Private parent member two', state: true }
                    };
                }
                return {};
            },
            buildDockerPreviewItem: ({ entry }) => ({
                $item: window.jQuery('<span class="outer fv-docker-preview-card"><span class="inner"><span class="appname"></span></span></span>')
                    .find('.appname').text(entry?.name || 'Member').end(),
                $tooltipTrigger: window.jQuery()
            }),
            applyFolderPreviewLayout: () => {},
            layoutFolderPreviewRows: layoutChildFolderFixtureRows,
            editFolder: () => { childFolderFixtureState.editCount += 1; },
            openFolderActions: () => { childFolderFixtureState.actionCount += 1; },
            recordChildFolderPreviewRender: actionsApi.recordChildFolderPreviewRender,
            recordChildFolderPreviewBinding: actionsApi.recordChildFolderPreviewBinding,
            recordChildFolderPreviewMenuOpen: actionsApi.recordChildFolderPreviewMenuOpen
        });
        childFolderHierarchyApi.renderNestedAggregatePreview(
            'fixture-parent',
            childFolderFixtureFolders['fixture-parent'],
            {},
            { includeChildFolders: true }
        );
        for (let pass = 0; pass < 2; pass += 1) {
            layoutChildFolderFixtureRows(
                window.jQuery('#fixture-child-folder-preview'),
                childFolderFixtureFolders['fixture-parent'].settings
            );
        }
        window.fixtureChildFolderPreviewContext = {
            closeMenu() {
                window.jQuery('.fv-folder-preview-context-menu').remove();
                window.jQuery(document).off('click.fvFolderPreviewContext keydown.fvFolderPreviewContext');
            },
            dispatchTouchClick() {
                this.closeMenu();
                const item = document.querySelector('#fixture-child-folder-preview .fv-folder-preview-child');
                const event = new Event('click', { bubbles: true, cancelable: true });
                Object.defineProperty(event, 'changedTouches', {
                    value: [{ clientX: 321, clientY: 145 }]
                });
                item.dispatchEvent(event);
            },
            snapshot() {
                const menu = document.querySelector('.fv-folder-preview-context-menu');
                return {
                    chipCount: document.querySelectorAll('#fixture-child-folder-preview .fv-folder-preview-child').length,
                    rowCount: document.querySelectorAll('#fixture-child-folder-preview .folder-preview-row').length,
                    menuCount: document.querySelectorAll('.fv-folder-preview-context-menu').length,
                    menuLeft: Number.parseFloat(menu?.style?.left || '0'),
                    menuTop: Number.parseFloat(menu?.style?.top || '0'),
                    menuActions: Array.from(menu?.querySelectorAll('button') || []).map((button) => button.textContent.trim()),
                    focusedAction: document.activeElement?.textContent?.trim() || '',
                    editCount: childFolderFixtureState.editCount,
                    actionCount: childFolderFixtureState.actionCount,
                    diagnostics: actionsApi.getPreviewContextDiagnosticsSnapshot()
                };
            }
        };
        window.fixtureNativePreviewContext.breakRows2HandlersAndAudit = () => {
            const $preview = window.jQuery('#fixture-context-preview-rows-2');
            const rows = $preview.children('.folder-preview-row').get();
            $preview.empty();
            rows.forEach((row) => $preview.append(row));
            return actionsApi.auditDockerPreviewContextBridges($preview, { preview_rows: 2 });
        };
        window.fixtureNativePreviewContext.snapshot = () => ({
            attachCount: window.fixtureNativePreviewContext.attachCount,
            openCount: window.fixtureNativePreviewContext.openCount,
            editCount: window.fixtureNativePreviewContext.editCount,
            quickActionCount: window.fixtureNativePreviewContext.quickActionCount,
            lastKey: window.fixtureNativePreviewContext.lastKey,
            lastPoint: window.fixtureNativePreviewContext.lastPoint,
            menuVisible: !document.querySelector('#fixture-native-context-menu').hidden,
            sourceRows2IdCount: document.querySelectorAll('#fixture-native-rows-2').length,
            sourceUnlimitedIdCount: document.querySelectorAll('#fixture-native-unlimited').length,
            previewNativeIdCount: document.querySelectorAll('.fixture-context-preview [id^="fixture-native-"]').length,
            previewInlineHandlerCount: document.querySelectorAll('.fixture-context-preview [onclick], .fixture-context-preview [oncontextmenu]').length,
            startedClassCount: document.querySelectorAll('.fixture-context-preview .state.fv-preview-status-started').length,
            bridgeCount: document.querySelectorAll('.fixture-context-preview [data-fv-preview-context="native"][role="button"][tabindex="0"]').length,
            previewRowCount: document.querySelectorAll('#fixture-context-preview-rows-2 .folder-preview-row, #fixture-context-preview-unlimited .folder-preview-row').length,
            diagnostics: actionsApi.getPreviewContextDiagnosticsSnapshot()
        });
        const layoutEngine = window.FolderViewPlusRuntimeColumnLayout.createColumnLayoutEngine({
            minWidth: 118,
            maxWidth: 1280,
            presetWidths: { compact: 128, standard: 142, wide: 188 },
            desktopVarName: '--fvplus-docker-app-column-width',
            mobileVarName: '--fvplus-docker-app-column-width-mobile',
            mobileScale: 1,
            mobileMin: 136
        });
        const target = window.jQuery('#action-target');
        const bootstrapWidth = layoutEngine.resolveBootstrapWidth({
            baseline: 142,
            cached: 142,
            estimated: 286,
            floor: 142
        });
        layoutEngine.applyCssWidthVars(bootstrapWidth);
        actionsApi.appendDockerPreviewActionButtons(
            target,
            actionSettings,
            'fixture-container',
            '/bin/sh',
            '',
            { webuiCapability: true, webuiHydrating: true }
        );

        const consoleBefore = target.children('.folder-element-console').get(0);
        const logsBefore = target.children('.folder-element-logs').get(0);
        const consoleRectBefore = consoleBefore.getBoundingClientRect();
        const logsRectBefore = logsBefore.getBoundingClientRect();
        const firstVisibleWidth = document.querySelector('#width-probe').getBoundingClientRect().width;

        window.fixturePreviewActionStability = {
            run: () => new Promise((resolve) => {
                window.setTimeout(() => {
                    actionsApi.reconcileDockerPreviewActionButtons(
                        target,
                        actionSettings,
                        'fixture-container',
                        '/bin/bash',
                        'https://example.invalid/',
                        { webuiCapability: true, webuiHydrating: false }
                    );
                    layoutEngine.applyCssWidthVars(bootstrapWidth);
                    window.requestAnimationFrame(() => window.requestAnimationFrame(() => {
                        const consoleAfter = target.children('.folder-element-console').get(0);
                        const logsAfter = target.children('.folder-element-logs').get(0);
                        const consoleRectAfter = consoleAfter.getBoundingClientRect();
                        const logsRectAfter = logsAfter.getBoundingClientRect();
                        const slotWidths = target.children('.fv-preview-action-slot').get().map((node) => (
                            node.getBoundingClientRect().width
                        ));
                        resolve({
                            consoleNodePreserved: consoleAfter === consoleBefore,
                            logsNodePreserved: logsAfter === logsBefore,
                            consoleShiftPx: Math.abs(consoleRectAfter.left - consoleRectBefore.left),
                            logsShiftPx: Math.abs(logsRectAfter.left - logsRectBefore.left),
                            webuiReady: target.children('.folder-element-webui.is-ready').length === 1,
                            pendingWebui: target.children('.folder-element-webui.is-pending').length,
                            slotWidths,
                            bootstrapWidth,
                            firstVisibleWidth,
                            settledWidth: document.querySelector('#width-probe').getBoundingClientRect().width
                        });
                    }));
                }, 120);
            })
        };

        let contextAttachCount = 0;
        let contextOpenCount = 0;
        let contextDefaultPrevented = false;
        let contextListener = null;
        const contextTarget = document.querySelector('#folder-context-target');
        const rowActionsController = window.FolderViewDockerRuntimeShared.createFolderRowActionsController({
            window,
            document,
            $: window.jQuery,
            namespace: 'fvFixtureFolderRowAction',
            actionAttribute: 'data-fv-fixture-folder-action',
            handlers: {
                context: () => {
                    contextAttachCount += 1;
                    if (contextListener) {
                        contextTarget.removeEventListener('click', contextListener);
                    }
                    contextListener = (event) => {
                        contextOpenCount += 1;
                        contextDefaultPrevented = event.defaultPrevented;
                    };
                    contextTarget.addEventListener('click', contextListener);
                },
                edit: () => {},
                toggle: () => {}
            }
        });
        rowActionsController.decorate(window.jQuery('#folder-row'), 'fixture-folder');
        rowActionsController.bind();
        window.fixtureFolderContextFirstClick = {
            run: () => {
                document.querySelector('#folder-context-child').click();
                return {
                    attachCount: contextAttachCount,
                    openCount: contextOpenCount,
                    defaultPrevented: contextDefaultPrevented
                };
            }
        };

        window.fixtureQueuedFolderPinIntent = {
            run: async () => {
                const runner = window.FolderViewDockerRuntimeShared.createSafeUiActionRunner();
                let releasePin;
                const pinSave = new Promise((resolve) => {
                    releasePin = resolve;
                });
                const transitions = [];
                let pinned = false;
                const applyIntent = (nextPinned) => {
                    if (pinned === nextPinned) {
                        return;
                    }
                    pinned = nextPinned;
                    transitions.push(nextPinned ? 'pinned' : 'unpinned');
                };
                const pin = runner.run('docker-pin:fixture-folder', async (intent) => {
                    await pinSave;
                    transitions.push('pin-saved');
                    if (intent.isLatest()) {
                        applyIntent(true);
                    }
                }, { onIntent: () => applyIntent(true) });
                const unpin = runner.run('docker-pin:fixture-folder', async (intent) => {
                    transitions.push('unpin-saved');
                    if (intent.isLatest()) {
                        applyIntent(false);
                    }
                }, { queueIfBusy: true, onIntent: () => applyIntent(false) });
                const queuedBeforeSave = runner.isQueued('docker-pin:fixture-folder');
                const pinnedBeforeSave = pinned;
                releasePin();
                await Promise.all([pin, unpin]);
                return {
                    queuedBeforeSave,
                    pinnedBeforeSave,
                    pinned,
                    transitions,
                    runningAfterSave: runner.isRunning('docker-pin:fixture-folder'),
                    queuedAfterSave: runner.isQueued('docker-pin:fixture-folder')
                };
            }
        };
    </script>
</body>
</html>
