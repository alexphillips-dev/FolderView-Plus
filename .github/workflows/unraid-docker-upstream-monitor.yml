name: Unraid Docker Upstream Monitor

on:
  schedule:
    - cron: '43 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: folderview-plus-unraid-docker-upstream-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Check Docker API and native page compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FolderView Plus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Fetch current Unraid release notes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/unraid/docs.git "${RUNNER_TEMP}/unraid-docs"
          git -C "${RUNNER_TEMP}/unraid-docs" sparse-checkout set docs/unraid-os/release-notes

      - name: Check upstream activation signals
        id: monitor
        shell: bash
        run: |
          bash scripts/unraid_docker_upstream_monitor.sh \
            --release-notes-dir "${RUNNER_TEMP}/unraid-docs/docs/unraid-os/release-notes" \
            --github-output "${GITHUB_OUTPUT}" \
            --json

      - name: Publish monitor summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Unraid Docker interface monitor"
            echo
            echo "- Status: \`${{ steps.monitor.outputs.status || 'unknown' }}\`"
            echo "- Reason: \`${{ steps.monitor.outputs.reason || 'monitor-did-not-complete' }}\`"
            echo "- Source gate: \`${{ steps.monitor.outputs.source_gate || 'unknown' }}\`"
            echo "- Release announcement: \`${{ steps.monitor.outputs.release_announcement || 'unknown' }}\`"
            echo "- Docker schema: \`${{ steps.monitor.outputs.schema_status || 'unknown' }}\`"
            echo "- Latest API release: \`${{ steps.monitor.outputs.latest_api_release || 'unknown' }}\`"
            echo "- API release baseline: \`${{ steps.monitor.outputs.api_release_status || 'unknown' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create or update compatibility alert
        if: always() && steps.monitor.outputs.status != 'dormant'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.monitor.outputs.status || 'unknown' }}
          REASON: ${{ steps.monitor.outputs.reason || 'monitor-did-not-complete' }}
          SOURCE_GATE: ${{ steps.monitor.outputs.source_gate || 'unknown' }}
          RELEASE_ANNOUNCEMENT: ${{ steps.monitor.outputs.release_announcement || 'unknown' }}
          SCHEMA_STATUS: ${{ steps.monitor.outputs.schema_status || 'unknown' }}
          SCHEMA_SIGNATURE: ${{ steps.monitor.outputs.schema_signature || 'unknown' }}
          LATEST_API_RELEASE: ${{ steps.monitor.outputs.latest_api_release || 'unknown' }}
          API_RELEASE_STATUS: ${{ steps.monitor.outputs.api_release_status || 'unknown' }}
        shell: bash
        run: |
          set -euo pipefail
          title="Unraid Docker upstream compatibility review required"
          body_file="$(mktemp)"
          {
            echo "The scheduled FolderView Plus monitor detected an upstream Docker interface state that is no longer safely dormant."
            echo
            echo "- Status: \`${STATUS}\`"
            echo "- Reason: \`${REASON}\`"
            echo "- Source gate: \`${SOURCE_GATE}\`"
            echo "- Release announcement: \`${RELEASE_ANNOUNCEMENT}\`"
            echo "- Docker schema: \`${SCHEMA_STATUS}\`"
            echo "- Docker schema signature: \`${SCHEMA_SIGNATURE}\`"
            echo "- Latest API release: \`${LATEST_API_RELEASE}\`"
            echo "- API release baseline: \`${API_RELEASE_STATUS}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Follow \`docs/unraid-docker-prerelease-qualification.md\`. Keep native-page safe mode enabled until fixture and live-host qualification pass."
          } > "${body_file}"
          issue_number="$(
            gh issue list \
              --state open \
              --search "\"${title}\" in:title" \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" \
              | head -n 1
          )"
          if [[ -n "${issue_number}" ]]; then
            gh issue comment "${issue_number}" --body-file "${body_file}"
            echo "Updated compatibility issue #${issue_number}."
          else
            gh issue create --title "${title}" --body-file "${body_file}"
          fi
