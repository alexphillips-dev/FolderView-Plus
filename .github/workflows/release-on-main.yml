name: Release On Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folderview-plus-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env

      - name: Detect release artifact changes
        id: release_scope
        shell: bash
        run: |
          set -euo pipefail
          MANUAL_DISPATCH='${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}'
          BEFORE_SHA='${{ github.event.before }}'
          AFTER_SHA='${{ github.sha }}'
          RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            RANGE="${AFTER_SHA}^..${AFTER_SHA}"
          fi

          mapfile -t changed_files < <(git diff --name-only "${RANGE}" || true)
          should_publish=0
          for changed_file in "${changed_files[@]}"; do
            case "${changed_file}" in
              folderview.plus.plg|archive/*.txz|archive/*.sha256)
                should_publish=1
                break
                ;;
            esac
          done
          if [[ "${MANUAL_DISPATCH}" == '1' ]]; then
            should_publish=1
          fi

          {
            echo "range=${RANGE}"
            echo "manual_dispatch=${MANUAL_DISPATCH}"
            echo "should_publish=${should_publish}"
          } >> "${GITHUB_OUTPUT}"

      - name: Skip release publish for non-release main pushes
        if: steps.release_scope.outputs.should_publish != '1'
        shell: bash
        run: |
          {
            echo "## Release publish skipped"
            echo
            echo "No release artifacts changed on this \`main\` push, so GitHub release publishing was intentionally skipped."
            echo "Workflow/process-only syncs can land on \`main\` without creating a new plugin release."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Resolve release version and archive
        id: release_meta
        if: steps.release_scope.outputs.should_publish == '1'
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '<!ENTITY version "\K[^"]+' folderview.plus.plg)
          ARCHIVE="archive/folderview.plus-${VERSION}.txz"
          CHECKSUM="${ARCHIVE}.sha256"
          if [ ! -f "${ARCHIVE}" ]; then
            echo "ERROR: expected archive not found: ${ARCHIVE}" >&2
            exit 1
          fi
          if [ ! -f "${CHECKSUM}" ]; then
            ARCHIVE_BASENAME="$(basename "${ARCHIVE}")"
            sha256sum "${ARCHIVE}" | awk -v name="${ARCHIVE_BASENAME}" '{print $1 "  " name}' > "${CHECKSUM}"
            echo "Generated missing checksum: ${CHECKSUM}"
          fi
          {
            echo "version=${VERSION}"
            echo "archive=${ARCHIVE}"
            echo "checksum=${CHECKSUM}"
            echo "tag=v${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Run release validation suite
        if: steps.release_scope.outputs.should_publish == '1'
        env:
          FVPLUS_UNRAID_MATRIX: ${{ secrets.FVPLUS_UNRAID_MATRIX }}
          FVPLUS_UNRAID_MATRIX_REQUIRED: '1'
          FVPLUS_UNRAID_REQUIRED_VERSIONS: '7.0.x,7.2.x,7.3.x'
          FVPLUS_UNRAID_REQUIRED_THEMES: 'black,white'
          FVPLUS_I18N_STRICT: '1'
          FVPLUS_DEAD_CODE_STRICT: '1'
          FVPLUS_REQUIRE_PERF_BASELINE: '1'
          FVPLUS_REQUIRE_EXPLICIT_RELEASE_NOTES: '1'
          FVPLUS_MAIN_HISTORY_BASE_REF: ${{ github.event.before }}
          FVPLUS_BROWSER_SMOKE_URL: ${{ secrets.FVPLUS_BROWSER_SMOKE_URL }}
          FVPLUS_BROWSER_SMOKE_REQUIRED: '1'
          FVPLUS_BROWSER_SMOKE_TIMEOUT_MS: '90000'
          FVPLUS_BROWSER_SMOKE_IGNORE_HTTPS: '1'
          FVPLUS_BROWSER_SMOKE_REQUIRE_FOLDER_EDITOR: '1'
          FVPLUS_BROWSER_SMOKE_REQUIRE_RUNTIME_ROWS: '1'
          FVPLUS_BROWSER_SMOKE_RUNTIME_GAP_MAX: '30'
          FVPLUS_BROWSER_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/tmp/browser-smoke-artifacts
          FVPLUS_THEME_MATRIX_URLS: ${{ secrets.FVPLUS_THEME_MATRIX_URLS }}
          FVPLUS_THEME_MATRIX_REQUIRED: '1'
          FVPLUS_THEME_REQUIRED_LABELS: 'black,white'
          FVPLUS_THEME_SMOKE_TIMEOUT_MS: '90000'
          FVPLUS_THEME_SMOKE_IGNORE_HTTPS: '1'
          FVPLUS_THEME_SMOKE_BROWSERS: 'chromium,firefox,webkit'
          FVPLUS_THEME_SMOKE_ZOOMS: '1,1.25,1.5'
          FVPLUS_THEME_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/tmp/browser-smoke-artifacts/theme-matrix
          FVPLUS_FIXTURE_BROWSERS: chromium,firefox,webkit
          FVPLUS_FIXTURE_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/tmp/fixture-browser-artifacts
          FVPLUS_PLAYWRIGHT_INSTALL_WITH_DEPS: '1'
        run: |
          chmod +x scripts/run_ci_suite.sh
          bash scripts/run_ci_suite.sh --release

      - name: Build release notes from current CHANGES block
        id: notes
        if: steps.release_scope.outputs.should_publish == '1'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release_meta.outputs.version }}"
          chmod +x scripts/build_release_notes.sh
          bash scripts/build_release_notes.sh --version "${VERSION}" --output release_notes.md

      - name: Validate remote raw publish artifacts
        if: steps.release_scope.outputs.should_publish == '1'
        env:
          FVPLUS_REMOTE_PUBLISH_ATTEMPTS: '30'
          FVPLUS_REMOTE_PUBLISH_DELAY_SEC: '10'
        run: |
          chmod +x scripts/remote_publish_guard.sh
          bash scripts/remote_publish_guard.sh

      - name: Ensure GitHub CLI
        if: steps.release_scope.outputs.should_publish == '1'
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create or update GitHub release
        if: steps.release_scope.outputs.should_publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          FVPLUS_GITHUB_RELEASE_ATTEMPTS: '6'
          FVPLUS_GITHUB_RELEASE_DELAY_SEC: '10'
        run: |
          set -euo pipefail
          TAG="${{ steps.release_meta.outputs.tag }}"
          ARCHIVE="${{ steps.release_meta.outputs.archive }}"
          CHECKSUM="${{ steps.release_meta.outputs.checksum }}"

          retry_command() {
            local label="$1"
            shift
            local attempts="${FVPLUS_GITHUB_RELEASE_ATTEMPTS:-6}"
            local delay="${FVPLUS_GITHUB_RELEASE_DELAY_SEC:-10}"
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                echo "::error::${label} failed after ${attempts} attempts."
                return 1
              fi
              echo "::warning::${label} failed on attempt ${attempt}/${attempts}; retrying in ${delay}s."
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay < 60 ? delay * 2 : 60))
            done
          }

          release_exists=0
          inspect_attempt=1
          while (( inspect_attempt <= FVPLUS_GITHUB_RELEASE_ATTEMPTS )); do
            set +e
            inspect_output="$(gh release view "${TAG}" 2>&1)"
            inspect_status=$?
            set -e
            if (( inspect_status == 0 )); then
              release_exists=1
              break
            fi
            if grep -Eiq 'release not found|HTTP 404|Not Found' <<<"${inspect_output}"; then
              break
            fi
            if (( inspect_attempt >= FVPLUS_GITHUB_RELEASE_ATTEMPTS )); then
              echo "${inspect_output}" >&2
              echo "::error::Unable to determine whether release ${TAG} exists after ${inspect_attempt} attempts."
              exit 1
            fi
            echo "::warning::Release lookup failed on attempt ${inspect_attempt}/${FVPLUS_GITHUB_RELEASE_ATTEMPTS}; retrying."
            sleep "${FVPLUS_GITHUB_RELEASE_DELAY_SEC}"
            inspect_attempt=$((inspect_attempt + 1))
          done

          create_or_confirm_release() {
            if gh release create "${TAG}" --title "${TAG}" --notes-file release_notes.md; then
              return 0
            fi
            gh release view "${TAG}" >/dev/null 2>&1
          }

          if (( release_exists == 1 )); then
            retry_command "Update release metadata" gh release edit "${TAG}" --title "${TAG}" --notes-file release_notes.md
            echo "Updated release ${TAG} metadata."
          else
            retry_command "Create release" create_or_confirm_release
            echo "Created release ${TAG}."
          fi
          retry_command "Upload release package" gh release upload "${TAG}" "${ARCHIVE}" --clobber
          retry_command "Upload release checksum" gh release upload "${TAG}" "${CHECKSUM}" --clobber
          echo "Published release ${TAG} package and checksum assets."

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-on-main-debug-${{ github.run_id }}-${{ github.job }}
          if-no-files-found: ignore
          path: |
            folderview.plus.plg
            folderview.plus.xml
            archive/*.txz
            archive/*.sha256
            release_notes.md
            tmp/browser-smoke-artifacts/**
            tmp/fixture-browser-artifacts/**
            *.log
            scripts/*.log
